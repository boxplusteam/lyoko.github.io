<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECTOR 5 | Sistema Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        s5: { cyan: '#00f0ff', blue: '#0077ff', dark: '#020617', white: '#e2f8ff' }
                    },
                    fontFamily: { orbitron: ['Orbitron', 'sans-serif'], rajdhani: ['Rajdhani', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { background-color: #020617; color: #b3e5fc; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; margin: 0; padding: 0; }
        #circuit-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: radial-gradient(circle at center, #051024 0%, #020617 100%); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, rgba(2,6,23,0.3) 0%, rgba(2,6,23,0.85) 100%); z-index: -1; pointer-events: none; }
        
        .glass-panel {
            background: rgba(4, 13, 30, 0.55); backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.15); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.4s ease; position: relative; margin-bottom: 2rem;
        }
        .glass-panel:hover { border-color: rgba(0, 240, 255, 0.35); }
        
        .btn-leer {
            display: inline-block; padding: 10px 24px; margin-top: 20px;
            background: rgba(0, 240, 255, 0.1); border: 1px solid #00f0ff; color: #00f0ff;
            font-family: 'Orbitron', sans-serif; text-transform: uppercase; text-decoration: none;
            transition: all 0.3s ease; letter-spacing: 2px;
        }
        .btn-leer:hover { background: #00f0ff; color: #020617; box-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #00f0ff; }
    </style>
</head>
<body class="selection:bg-s5-cyan selection:text-black flex flex-col min-h-screen">

    <canvas id="circuit-canvas"></canvas>
    <div class="bg-overlay"></div>

    <main class="relative z-10 flex-1 container mx-auto px-4 md:px-8 max-w-5xl flex flex-col justify-center py-12">
        
        <section id="noticias" class="w-full">
            <div class="flex items-center gap-4 mb-8">
                <i class="fa-solid fa-terminal text-xl text-s5-cyan"></i>
                <h3 class="text-xl font-orbitron font-bold text-white tracking-[0.2em] uppercase">Registros de Memoria</h3>
                <div class="h-[1px] flex-1 bg-gradient-to-r from-s5-cyan/30 to-transparent ml-4"></div>
            </div>

            <!-- CONTENEDOR DONDE SE INYECTAN LAS NOTICIAS -->
            <div id="contenedor-noticias"></div>

        </section>
    </main>

    <script>
        // LÓGICA PARA LEER EL JSON E INYECTAR LAS NOTICIAS
        document.addEventListener('DOMContentLoaded', () => {
            fetch('lyoko.json')
                .then(response => response.json())
                .then(data => {
                    const contenedor = document.getElementById('contenedor-noticias');
                    
                    data.forEach(noticia => {
                        const article = document.createElement('article');
                        article.className = 'glass-panel p-8 md:p-12 border-l-2 border-l-s5-cyan';
                        
                        let imgHTML = '';
                        if(noticia.imagenUrl) {
                            // Aplica tamaño y borde definidos en el JSON
                            imgHTML = `
                                <div class="my-6">
                                    <img src="${noticia.imagenUrl}" 
                                         style="max-width: 100%; width: ${noticia.imagenWidth}px; border: ${noticia.imagenBorder}px solid #00f0ff; border-radius: 4px; box-shadow: 0 0 10px rgba(0,240,255,0.2);"
                                         alt="Imagen de archivo">
                                </div>
                            `;
                        }

                        let linkHTML = '';
                        if(noticia.linkNoticia) {
                            linkHTML = `<a href="${noticia.linkNoticia}" target="_blank" class="btn-leer">> Leer Noticia Entera</a>`;
                        }

                        article.innerHTML = `
                            <div class="flex flex-wrap items-center gap-3 text-[10px] font-mono text-s5-cyan/70 mb-6 border-b border-s5-cyan/20 pb-4 uppercase">
                                <span>> ARCHIVO: ${noticia.archivo || 'DESCONOCIDO'}</span>
                                <span class="hidden sm:inline">|</span>
                                <span>FUENTE: ${noticia.fuente || 'SISTEMA'}</span>
                            </div>
                            <h1 class="text-2xl md:text-4xl font-orbitron font-bold text-white leading-tight mb-8">
                                ${noticia.titulo}
                            </h1>
                            <div class="prose prose-invert max-w-none font-rajdhani font-light text-gray-300 text-lg">
                                ${noticia.texto}
                                ${imgHTML}
                            </div>
                            ${linkHTML}
                        `;
                        contenedor.appendChild(article);
                    });
                })
                .catch(err => console.error("Error al cargar lyoko.json:", err));
        });

        // Lógica de los Circuitos del Fondo (Se mantiene igual que la original)
        const canvas = document.getElementById('circuit-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            let numParticles = Math.floor((width * height) / 10000);
            for(let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * width, y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 2.2, vy: (Math.random() - 0.5) * 2.2,
                    radius: Math.random() * 2 + 1, pulseOffset: Math.random() * Math.PI * 2
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();
        let time = 0;

        function drawCanvas() {
            time += 0.04;
            ctx.clearRect(0, 0, width, height);
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > width) p.vx *= -1;
                if(p.y < 0 || p.y > height) p.vy *= -1;
                let currentRadius = p.radius + Math.sin(time * 2 + p.pulseOffset) * 0.8;
                ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, currentRadius), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 240, 255, 0.8)'; ctx.fill();
                for(let j = index + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if(dist < 130) {
                        let alpha = (1 - dist / 130) * 0.35;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`; ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawCanvas);
        }
        drawCanvas();
    </script>
</body>
</html>
