<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JEREMY DIGITAL JOURNAL</title>

<style>

/* =========================================================
   CURSOR PERSONALIZADO
========================================================= */
* {
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="%2300E5FF"><polygon points="0,0 24,12 12,14 14,24 9,24 7,14 0,19"/></svg>'), auto !important;
}

/* =========================================================
   FUENTES
========================================================= */

@font-face{

    font-family:'Gunship';

    src:url('GUNSHIP2.TTF')
    format('truetype');
}

/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

html,body{

    width:100%;
    height:100%;
    overflow:hidden;

    background:#000814;

    font-family:
    'Courier New',
    monospace;
}

/* =========================================================
   FONDO
========================================================= */

body{

    background:
    radial-gradient(
    circle at center,
    #002255 0%,
    #000814 70%);
}

/* =========================================================
   TERMINALES
========================================================= */

#scene{

    position:fixed;
    inset:0;

    overflow:hidden;
    perspective:1000px;
}

.terminal{

    position:absolute;

    width:170px;
    height:170px;

    border:1px solid
    rgba(0,229,255,.45);

    background:
    linear-gradient(
    180deg,
    rgba(0,229,255,.05),
    rgba(0,229,255,.01)
    );

    color:#00E5FF;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:13px;

    line-height:18px;

    text-align:center;

    opacity:0;

    box-shadow:
    0 0 20px rgba(0,229,255,.15);
}

/* =========================================================
   LOGO XANA
========================================================= */

.center{

    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:100;
}

.logo{

    width:220px;

    animation:
    floatLogo 5s ease-in-out infinite,
    pulseLogo 2s ease-in-out infinite;

    filter:
    drop-shadow(0 0 20px #00E5FF)
    drop-shadow(0 0 60px rgba(0,229,255,.4));
}

.logo:hover{

    transform:scale(1.06);
}

@keyframes floatLogo{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

@keyframes pulseLogo{

    0%,100%{

        filter:
        drop-shadow(0 0 20px #00E5FF)
        drop-shadow(0 0 60px rgba(0,229,255,.4));
    }

    50%{

        filter:
        drop-shadow(0 0 45px #00E5FF)
        drop-shadow(0 0 120px rgba(0,229,255,.9));
    }
}

/* =========================================================
   ZOOM XANA
========================================================= */

.zoomOut{

    animation:
    xanaZoom 2s cubic-bezier(.15,.7,0,1)
    forwards;
}

@keyframes xanaZoom{

    0%{

        transform:scale(1);
        opacity:1;
    }

    100%{

        transform:scale(25);
        opacity:0;
    }
}

/* =========================================================
   VENTANA
========================================================= */

#journalWindow{

    position:absolute;

    top:50%;
    left:50%;

    width:1000px;
    height:680px;

    transform:
    translate(-50%,-50%)
    scale(.3);

    opacity:0;

    background:
    linear-gradient(
    180deg,
    #123d70,
    #08172e
    );

    border:2px solid #7feeff;

    box-shadow:
    0 0 45px rgba(0,229,255,.5);

    overflow-y:auto;

    z-index:200;

    pointer-events:none;
}

/* =========================================================
   ANIMACION LIBRO DIGITAL
========================================================= */

.bookOpen{

    animation:
    digitalBook 1.7s
    cubic-bezier(.15,.8,.1,1)
    forwards;
}

@keyframes digitalBook{

    0%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        perspective(1400px)
        rotateY(-90deg)
        scale(.1);
    }

    50%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        perspective(1400px)
        rotateY(10deg)
        scale(1.05);
    }

    100%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        perspective(1400px)
        rotateY(0deg)
        scale(1);
    }
}

/* =========================================================
   HEADER
========================================================= */

.window-header{

    height:40px;

    background:
    linear-gradient(
    90deg,
    #35a8ff,
    #7feeff);

    display:flex;
    align-items:center;
    justify-content:center;

    border-bottom:
    2px solid #7feeff;

    position:sticky;
    top:0;
    z-index:10;
}

/* =========================================================
   TITULO LOGO CD
========================================================= */

.window-title{

    font-family:'Gunship';

    letter-spacing:4px;

    color:white;

    font-size:15px;

    text-shadow:
    0 0 15px rgba(255,255,255,.8);

    display:flex;
    align-items:center;
    gap:15px;
}

/* =========================================================
   CD LOGO
========================================================= */

.logo-cd{

    width:32px;
    height:32px;

    border-radius:50%;

    position:relative;

    background:
    radial-gradient(
    circle,
    #ffffff 0%,
    #9ce8ff 18%,
    #31b4ff 55%,
    #003b7a 100%
    );

    border:2px solid white;

    animation:
    spinCD 6s linear infinite;
}

.logo-cd::after{

    content:'';

    position:absolute;

    width:7px;
    height:7px;

    background:white;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);
}

@keyframes spinCD{

    from{

        transform:rotate(0deg);
    }

    to{

        transform:rotate(360deg);
    }
}

/* =========================================================
   CONTENT
========================================================= */

.window-content{

    padding:40px;
}

/* =========================================================
   GRID
========================================================= */

.journal-grid{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:50px 45px;

    justify-items:center;
}

/* =========================================================
   ITEM
========================================================= */

.journal-item{

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:18px;

    opacity:0;

    transform:
    scale(.2)
    rotateY(180deg);
}

/* =========================================================
   SISTEMA DE BLOQUEO
========================================================= */

.journal-item.locked {
    filter: grayscale(100%) brightness(0.4);
}

.journal-item.locked .journal-rhombus {
    border-color: #ff0000;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
    background: #330000;
    animation: none;
}

.journal-item.locked:hover .journal-rhombus {
    transform: rotate(45deg) scale(1);
    box-shadow: 0 0 30px rgba(255,0,0,0.8);
    border-color: #ff6666;
}

/* =========================================================
   ENTRADA CAPS
========================================================= */

.journal-item.show{

    animation:
    iconIntro 1.2s
    cubic-bezier(.15,.8,.1,1)
    forwards;
}

@keyframes iconIntro{

    0%{

        opacity:0;

        transform:
        scale(.1)
        rotateY(720deg);
    }

    60%{

        opacity:1;

        transform:
        scale(1.15)
        rotateY(0deg);
    }

    100%{

        opacity:1;

        transform:
        scale(1)
        rotateY(0deg);
    }
}

/* =========================================================
   ROMBO
========================================================= */

.journal-rhombus{

    width:88px;
    height:88px;

    transform:rotate(45deg);

    position:relative;

    background:
    linear-gradient(
    145deg,
    #0b4d88,
    #1f8be0
    );

    border:3px solid #9fe7ff;

    transition:
    transform .3s,
    background .3s,
    box-shadow .3s;

    box-shadow:
    0 0 20px rgba(82,225,242,.7),
    inset 0 0 12px rgba(255,255,255,.3);

    animation:
    floatRhombus 4s ease-in-out infinite;
}

@keyframes floatRhombus{

    0%{

        transform:
        rotate(45deg)
        translateY(0px);
    }

    50%{

        transform:
        rotate(45deg)
        translateY(-10px);
    }

    100%{

        transform:
        rotate(45deg)
        translateY(0px);
    }
}

/* =========================================================
   HOVER NARANJA
========================================================= */

.journal-item:not(.locked):hover .journal-rhombus{

    background:
    linear-gradient(
    145deg,
    #ffb300,
    #ff5e00
    );

    border-color:#ffe2a8;

    transform:
    rotate(45deg)
    scale(1.1);

    box-shadow:
    0 0 40px rgba(255,140,0,1),
    inset 0 0 18px rgba(255,255,255,.8);
}

/* =========================================================
   CAP SELECCIONADO
========================================================= */

.journal-rhombus.active{

    background:
    linear-gradient(
    145deg,
    #ffb300,
    #ff5e00
    );

    border-color:#fff0c2;

    box-shadow:
    0 0 55px rgba(255,140,0,1);

    animation:
    activePulse .8s ease infinite alternate;
}

@keyframes activePulse{

    from{

        box-shadow:
        0 0 30px rgba(255,140,0,.6);
    }

    to{

        box-shadow:
        0 0 60px rgba(255,140,0,1);
    }
}

/* =========================================================
   CD ICON
========================================================= */

.cd-center{

    position:absolute;

    width:38px;
    height:38px;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%)
    rotate(-45deg);

    background:
    radial-gradient(
    circle,
    #ffffff 0%,
    #c7f4ff 20%,
    #3ab5ff 60%,
    #003c7a 100%
    );

    border:2px solid rgba(255,255,255,.9);

    animation:
    spinMiniCD 5s linear infinite;
}

@keyframes spinMiniCD{

    from{

        transform:
        translate(-50%,-50%)
        rotate(0deg);
    }

    to{

        transform:
        translate(-50%,-50%)
        rotate(360deg);
    }
}

.cd-center::after{

    content:'';

    position:absolute;

    width:8px;
    height:8px;

    background:white;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);
}

/* =========================================================
   LABEL
========================================================= */

.journal-label{

    color:white;

    font-weight:bold;

    letter-spacing:1px;

    font-size:11px;

    text-align:center;

    width:170px;

    text-shadow:
    0 0 10px rgba(0,229,255,.8);
}

/* =========================================================
   PLAYER Y CONTROLES SUPERIORES
========================================================= */

#player{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.9);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999;
}

.player-box{

    width:900px;
    height:520px;

    background:#071b34;

    border:2px solid #7feeff;

    box-shadow:
    0 0 45px rgba(0,229,255,.5);

    overflow:hidden;

    animation:
    playerOpen .7s ease;
}

@keyframes playerOpen{

    from{

        transform:
        scale(.5);

        opacity:0;
    }

    to{

        transform:
        scale(1);

        opacity:1;
    }
}

.player-header{
    height:50px;
    background: linear-gradient(90deg, #35a8ff, #7feeff);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    color:white;
    font-family:'Gunship', sans-serif;
}

.player-controls-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.format-btn, .ratio-btn {
    background: #003b7a;
    color: #7feeff;
    border: 1px solid #7feeff;
    padding: 5px 10px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 12px;
}

.format-btn:hover, .ratio-btn:hover, .format-btn.active, .ratio-btn.active {
    background: #35a8ff;
    color: white;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
}

.closePlayer{

    font-size:20px;
    margin-left: 10px;
    cursor: pointer;
}

/* RESOLUCIONES */
.ratio-normal {
    width:100%;
    height:calc(100% - 50px);
    object-fit:contain;
    background:black;
}
.ratio-4-3 {
    width: auto !important;
    height: calc(100% - 50px) !important;
    aspect-ratio: 4 / 3;
    object-fit: fill;
    margin: 0 auto;
    display: block;
    background:black;
}
.ratio-16-9 {
    width: 100% !important;
    height: auto !important;
    aspect-ratio: 16 / 9;
    object-fit: fill;
    margin: auto;
    display: block;
    background:black;
}

/* =========================================================
   PANTALLA DE ERROR ANOMALIA
========================================================= */

#errorScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 9999;
    display: none;
    justify-content: center;
    align-items: center;
    color: white;
}

#errorScreen img {
    max-width: 10%;
    max-height: 10%;
    animation: errorGlitch 3.2s infinite;
}

@keyframes errorGlitch {
    0% { transform: skew(0deg); }
    20% { transform: skew(5deg); }
    40% { transform: skew(-5deg); }
    100% { transform: skew(0deg); }
}

</style>

/* =========================================================
   SÍNTESIS DE SONIDOS VÍA WEB AUDIO API (NO REQUIEREN MP3)
========================================================= */
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playSynth(type, freq, duration) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
}

function soundXanaChill() {
    playSynth('sine', 350, 1.5);
    setTimeout(() => playSynth('triangle', 550, 2), 200);
}

function soundComputerOpen() {
    playSynth('square', 800, 0.1);
    setTimeout(() => playSynth('sine', 1200, 0.4), 100);
    setTimeout(() => playSynth('sine', 1600, 0.6), 250);
}

function soundErrorXana() {
    playSynth('sawtooth', 150, 0.4);
    setTimeout(() => playSynth('sawtooth', 100, 0.4), 150);
    setTimeout(() => playSynth('sawtooth', 50, 0.8), 300);
}

/* =========================================================
   TERMINALES
========================================================= */

const TOTAL = 70;

const scene =
document.getElementById("scene");

const terminals = [];

for(let i=0;i<TOTAL;i++){

    const t =
    document.createElement("div");

    t.className =
    "terminal";

    t.innerHTML =
    "1111111111111111111<br>0000000000000000000<br>0011111111111111111";


    const x =
    (Math.random()-0.5)
    *5000;

    const y =
    (Math.random()-0.5)
    *3000;

    const z =
    Math.random()*5000+200;

    terminals.push({
        el:t,x,y,z
    });

    scene.appendChild(t);
}

const cx =
window.innerWidth/2;

const cy =
window.innerHeight/2;

function animate(){

    for(let t of terminals){

        t.z -= 18;

        if(t.z < 150){

            t.z = 5200;

            t.x =
            (Math.random()-0.5)
            *5000;

            t.y =
            (Math.random()-0.5)
            *3000;
        }

        const scale =
        1000 / t.z;

        const sx =
        cx + (t.x*scale);

        const sy =
        cy + (t.y*scale);

        t.el.style.opacity =
        scale*2;

        t.el.style.transform =
        `translate3d(${sx}px,
        ${sy}px,0)
        scale(${scale})`;
    }

    requestAnimationFrame(
    animate);
}

animate();

    // Iniciar audios
    if(audioCtx.state === 'suspended') audioCtx.resume();
    soundXanaChill();
    
    bgAudio.volume = 0.5;
    bgAudio.play().catch(e => console.log("Fondo sin cargar aún"));

    logo.classList.add(

    setTimeout(()=>{

        "none";

        journal.style.pointerEvents =
        "auto";

        journal.classList.add(

        soundComputerOpen();

});

/* =========================================================
   PLAYER & ASPECT RATIO & FULLSCREEN
========================================================= */

const player =
document.getElementById(
"player");

const video =
document.getElementById(
"videoPlayer");

const playerTitle =
document.getElementById(
"playerTitle");

function setAspectRatio(mode, btnElement) {
    document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');

    video.className = ''; 
    if (mode === '4:3') {
        video.classList.add('ratio-4-3');
    } else if (mode === '16:9') {
        video.classList.add('ratio-16-9');
    } else {
        video.classList.add('ratio-normal');
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        if (video.requestFullscreen) {
            video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) { /* Safari */
            video.webkitRequestFullscreen();
        } else if (video.msRequestFullscreen) { /* IE11 */
            video.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

// 1. Agrupar formatos bajo el mismo ID
const mapEpisodes = new Map();
rawEpisodes.forEach(ep => {
    
    // Extraer Temp y Cap para ordenar ej "T1.E01" -> Temp 1, Cap 1
    const match = ep.id.match(/T(\d+)\.E(\d+)/);
    const season = match ? parseInt(match[1]) : 0;
    const num = match ? parseInt(match[2]) : 0;

    if(!mapEpisodes.has(ep.id)) {
        mapEpisodes.set(ep.id, {
            id: ep.id,
            title: ep.title,
            season: season,
            num: num,
            videos: []
        });
    }

    const formatExt = ep.video.split('.').pop().toUpperCase();
    mapEpisodes.get(ep.id).videos.push({ format: formatExt, url: ep.video });
});

// 2. Ordenar por Temporada y luego por Número (00 al 97)
const sortedEpisodes = Array.from(mapEpisodes.values()).sort((a, b) => {
    if (a.season !== b.season) return a.season - b.season;
    return a.num - b.num;
});

/* =========================================================
   SISTEMA DE PROGRESO Y BLOQUEO
========================================================= */

let highestUnlockedIndex = parseInt(localStorage.getItem("highestUnlocked")) || 0;
let currentPlayingIndex = 0;

function triggerError() {
    soundErrorXana();
    const err = document.getElementById("errorScreen");
    err.style.display = "flex";
    setTimeout(() => {
        err.style.display = "none";
    }, 1500);
}

/* =========================================================
   CARGAR ICONOS Y RENDERIZAR
========================================================= */

function loadEpisodes(){

    const grid =
    document.getElementById(
    "journalGrid");
    
    grid.innerHTML = "";

    sortedEpisodes.forEach(
    (ep,index)=>{

        const item =
        document.createElement(
        "div");

        item.className =
        "journal-item";
        
        // Bloquear si el índice es mayor al máximo desbloqueado
        if(index > highestUnlockedIndex) {
            item.classList.add("locked");
        }

        item.innerHTML = `

        <div
        class="journal-rhombus">

            <div
            class="cd-center"></div>

        </div>

        <br>
        
        <div
        class="journal-label">

            ${ep.id}<br>
            ${ep.title}

        </div>

        `;

        setTimeout(()=>{

            item.classList.add(
            "show");

        },index * 90);

        const rhombus =
        item.querySelector(
        ".journal-rhombus");

        if(currentPlayingIndex === index && index <= highestUnlockedIndex){
            rhombus.classList.add("active");
        }

        item.addEventListener(
        "click",()=>{

            if(index > highestUnlockedIndex) {
                triggerError();
                return;
            }

            document
            .querySelectorAll(
            ".journal-rhombus")
            .forEach(r=>{
                r.classList.remove("active");
            });

            rhombus.classList.add("active");
            currentPlayingIndex = index;

            openPlayer(ep);

        });

        grid.appendChild(item);

    });
}

/* =========================================================
   ABRIR PLAYER Y SELECTOR MP4/MKV
========================================================= */

function openPlayer(ep){
    // Pausar música de fondo al abrir el reproductor
    if (bgAudio) {
        bgAudio.pause();
    }

    player.style.display = "flex";
    playerTitle.innerText = ep.id + " - " + ep.title;
    
    // Inyectar Botones de formato (si hay mp4, mkv, etc)
    const formatSelector = document.getElementById("formatSelector");
    formatSelector.innerHTML = "";
    
    ep.videos.forEach((vid, i) => {
        const btn = document.createElement("button");
        btn.className = "format-btn" + (i === 0 ? " active" : "");
        btn.innerText = vid.format;
        
        btn.onclick = () => {
            document.querySelectorAll(".format-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            
            // Mantener tiempo actual al cambiar fuente
            const currentTime = video.currentTime;
            video.src = vid.url;
            video.currentTime = currentTime;
            video.play();
        };
        
        formatSelector.appendChild(btn);
    });

    // Cargar por defecto la primera opción disponible
    video.src = ep.videos[0].url;
    video.play();
}

/* =========================================================
   AUTOPASE AL SIGUIENTE EPISODIO Y DESBLOQUEO
========================================================= */

video.addEventListener("ended", () => {
    // Si se acabó el último vídeo que tenías desbloqueado, desbloquea el siguiente
    if(currentPlayingIndex === highestUnlockedIndex && currentPlayingIndex < sortedEpisodes.length - 1) {
        highestUnlockedIndex++;
        localStorage.setItem("highestUnlocked", highestUnlockedIndex);
        loadEpisodes(); // Refrescar vista de cuadrícula para quitar candado
    }
    
    // Pasar al siguiente de forma automática
    if(currentPlayingIndex < sortedEpisodes.length - 1) {
        currentPlayingIndex++;
        
        // Actualizar UI del grid
        document.querySelectorAll(".journal-rhombus").forEach((r, idx) => {
            r.classList.remove("active");
            if(idx === currentPlayingIndex) r.classList.add("active");
        });
        
        openPlayer(sortedEpisodes[currentPlayingIndex]);
    } else {
        // Si no hay más episodios, simplemente volver a reproducir la música de fondo
        if (bgAudio) {
            bgAudio.play().catch(e => console.log(e));
        }
    }
});


/* =========================================================
   CERRAR PLAYER
========================================================= */

function closePlayer(){
    player.style.display = "none";
    video.pause();

    // Reanudar la música de fondo al salir del vídeo
    if (bgAudio) {
        bgAudio.play().catch(e => console.log(e));
    }
}
