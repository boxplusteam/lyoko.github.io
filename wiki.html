<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JEREMY DIGITAL JOURNAL - CHARACTERS</title>

<style>

/* =========================================================
   CURSOR PERSONALIZADO
========================================================= */
* {
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="%2300E5FF"><polygon points="0,0 24,12 12,14 14,24 9,24 7,14 0,19"/></svg>'), auto !important;
}

/* =========================================================
   FUENTES
========================================================= */

@font-face{

    font-family:'Gunship';

    src:url('GUNSHIP2.TTF')
    format('truetype');
}

/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

html,body{

    width:100%;
    height:100%;
    overflow:hidden;

    background:#000814;

    font-family:
    'Courier New',
    monospace;
}

/* =========================================================
   FONDO
========================================================= */

body{

    background:
    radial-gradient(
    circle at center,
    #002255 0%,
    #000814 70%);
}

/* =========================================================
   TERMINALES
========================================================= */

#scene{

    position:fixed;
    inset:0;

    overflow:hidden;
    perspective:1000px;
}

.terminal{

    position:absolute;

    width:170px;
    height:170px;

    border:1px solid
    rgba(0,229,255,.45);

    background:
    linear-gradient(
    180deg,
    rgba(0,229,255,.05),
    rgba(0,229,255,.01)
    );

    color:#00E5FF;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:13px;

    line-height:18px;

    text-align:center;

    opacity:0;

    box-shadow:
    0 0 20px rgba(0,229,255,.15);
}

/* =========================================================
   LOGO XANA
========================================================= */

.center{

    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:100;
}

.logo{

    width:220px;

    animation:
    floatLogo 5s ease-in-out infinite,
    pulseLogo 2s ease-in-out infinite;

    filter:
    drop-shadow(0 0 20px #00E5FF)
    drop-shadow(0 0 60px rgba(0,229,255,.4));
}

.logo:hover{

    transform:scale(1.06);
}

@keyframes floatLogo{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

@keyframes pulseLogo{

    0%,100%{

        filter:
        drop-shadow(0 0 20px #00E5FF)
        drop-shadow(0 0 60px rgba(0,229,255,.4));
    }

    50%{

        filter:
        drop-shadow(0 0 45px #00E5FF)
        drop-shadow(0 0 120px rgba(0,229,255,.9));
    }
}

/* =========================================================
   ZOOM XANA
========================================================= */

.zoomOut{

    animation:
    xanaZoom 2s cubic-bezier(.15,.7,0,1)
    forwards;
}

@keyframes xanaZoom{

    0%{

        transform:scale(1);
        opacity:1;
    }

    100%{

        transform:scale(25);
        opacity:0;
    }
}

/* =========================================================
   VENTANA
========================================================= */

#journalWindow{

    position:absolute;

    top:50%;
    left:50%;

    width:1000px;
    height:680px;

    transform:
    translate(-50%,-50%)
    scale(.3);

    opacity:0;

    background:
    linear-gradient(
    180deg,
    #123d70,
    #08172e
    );

    border:2px solid #7feeff;

    box-shadow:
    0 0 45px rgba(0,229,255,.5);

    overflow-y:auto;

    z-index:200;

    pointer-events:none;
}

/* =========================================================
   ANIMACION LIBRO DIGITAL
========================================================= */

.bookOpen{

    animation:
    digitalBook 1.7s
    cubic-bezier(.15,.8,.1,1)
    forwards;
}

@keyframes digitalBook{

    0%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        perspective(1400px)
        rotateY(-90deg)
        scale(.1);
    }

    50%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        perspective(1400px)
        rotateY(10deg)
        scale(1.05);
    }

    100%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        perspective(1400px)
        rotateY(0deg)
        scale(1);
    }
}

/* =========================================================
   HEADER
========================================================= */

.window-header{

    height:40px;

    background:
    linear-gradient(
    90deg,
    #35a8ff,
    #7feeff);

    display:flex;
    align-items:center;
    justify-content:center;

    border-bottom:
    2px solid #7feeff;

    position:sticky;
    top:0;
    z-index:10;
}

/* =========================================================
   TITULO LOGO CD
========================================================= */

.window-title{

    font-family:'Gunship';

    letter-spacing:4px;

    color:white;

    font-size:15px;

    text-shadow:
    0 0 15px rgba(255,255,255,.8);

    display:flex;
    align-items:center;
    gap:15px;
}

/* =========================================================
   CD LOGO
========================================================= */

.logo-cd{

    width:32px;
    height:32px;

    border-radius:50%;

    position:relative;

    background:
    radial-gradient(
    circle,
    #ffffff 0%,
    #9ce8ff 18%,
    #31b4ff 55%,
    #003b7a 100%
    );

    border:2px solid white;

    animation:
    spinCD 6s linear infinite;
}

.logo-cd::after{

    content:'';

    position:absolute;

    width:7px;
    height:7px;

    background:white;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);
}

@keyframes spinCD{

    from{

        transform:rotate(0deg);
    }

    to{

        transform:rotate(360deg);
    }
}

/* =========================================================
   CONTENT
========================================================= */

.window-content{

    padding:40px;
}

/* =========================================================
   GRID
========================================================= */

.journal-grid{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:50px 45px;

    justify-items:center;
}

/* =========================================================
   ITEM
========================================================= */

.journal-item{

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:18px;

    opacity:0;

    transform:
    scale(.2)
    rotateY(180deg);
}

/* =========================================================
   ENTRADA CAPS
========================================================= */

.journal-item.show{

    animation:
    iconIntro 1.2s
    cubic-bezier(.15,.8,.1,1)
    forwards;
}

@keyframes iconIntro{

    0%{

        opacity:0;

        transform:
        scale(.1)
        rotateY(720deg);
    }

    60%{

        opacity:1;

        transform:
        scale(1.15)
        rotateY(0deg);
    }

    100%{

        opacity:1;

        transform:
        scale(1)
        rotateY(0deg);
    }
}

/* =========================================================
   ROMBO
========================================================= */

.journal-rhombus{

    width:88px;
    height:88px;

    transform:rotate(45deg);

    position:relative;

    background:
    linear-gradient(
    145deg,
    #0b4d88,
    #1f8be0
    );

    border:3px solid #9fe7ff;

    transition:
    transform .3s,
    background .3s,
    box-shadow .3s;

    box-shadow:
    0 0 20px rgba(82,225,242,.7),
    inset 0 0 12px rgba(255,255,255,.3);

    animation:
    floatRhombus 4s ease-in-out infinite;
}

@keyframes floatRhombus{

    0%{

        transform:
        rotate(45deg)
        translateY(0px);
    }

    50%{

        transform:
        rotate(45deg)
        translateY(-10px);
    }

    100%{

        transform:
        rotate(45deg)
        translateY(0px);
    }
}

/* =========================================================
   HOVER NARANJA
========================================================= */

.journal-item:hover .journal-rhombus{

    background:
    linear-gradient(
    145deg,
    #ffb300,
    #ff5e00
    );

    border-color:#ffe2a8;

    transform:
    rotate(45deg)
    scale(1.1);

    box-shadow:
    0 0 40px rgba(255,140,0,1),
    inset 0 0 18px rgba(255,255,255,.8);
}

/* =========================================================
   CAP SELECCIONADO
========================================================= */

.journal-rhombus.active{

    background:
    linear-gradient(
    145deg,
    #ffb300,
    #ff5e00
    );

    border-color:#fff0c2;

    box-shadow:
    0 0 55px rgba(255,140,0,1);

    animation:
    activePulse .8s ease infinite alternate;
}

@keyframes activePulse{

    from{

        box-shadow:
        0 0 30px rgba(255,140,0,.6);
    }

    to{

        box-shadow:
        0 0 60px rgba(255,140,0,1);
    }
}

/* =========================================================
   CD ICON
========================================================= */

.cd-center{

    position:absolute;

    width:38px;
    height:38px;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%)
    rotate(-45deg);

    background:
    radial-gradient(
    circle,
    #ffffff 0%,
    #c7f4ff 20%,
    #3ab5ff 60%,
    #003c7a 100%
    );

    border:2px solid rgba(255,255,255,.9);

    animation:
    spinMiniCD 5s linear infinite;
}

@keyframes spinMiniCD{

    from{

        transform:
        translate(-50%,-50%)
        rotate(0deg);
    }

    to{

        transform:
        translate(-50%,-50%)
        rotate(360deg);
    }
}

.cd-center::after{

    content:'';

    position:absolute;

    width:8px;
    height:8px;

    background:white;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);
}

/* =========================================================
   LABEL
========================================================= */

.journal-label{

    color:white;

    font-weight:bold;

    letter-spacing:1px;

    font-size:11px;

    text-align:center;

    width:170px;

    text-shadow:
    0 0 10px rgba(0,229,255,.8);
}

/* =========================================================
   VISOR DE PERSONAJES
========================================================= */

#characterViewer {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.character-box {
    width:800px;
    height:500px;
    background:#071b34;
    border:2px solid #7feeff;
    box-shadow:0 0 45px rgba(0,229,255,.5);
    display:flex;
    flex-direction:column;
    animation: playerOpen .7s ease;
}

@keyframes playerOpen{
    from{
        transform: scale(.5);
        opacity:0;
    }
    to{
        transform: scale(1);
        opacity:1;
    }
}

.player-header {
    height:50px;
    background: linear-gradient(90deg, #35a8ff, #7feeff);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    color:white;
    font-family:'Gunship', sans-serif;
}

.closePlayer {
    font-size:20px;
    margin-left: 10px;
    cursor: pointer;
}

.char-content {
    display:flex; 
    flex:1; 
    padding:20px; 
    gap:20px; 
    color:white; 
    overflow-y:auto;
}

.char-image-container {
    flex:1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.char-image-container img {
    max-width:100%;
    max-height: 400px;
    border: 2px solid #7feeff;
    box-shadow: 0 0 15px rgba(0,229,255,0.4);
    object-fit: contain;
}

.char-details {
    flex:1.5; 
    font-family:'Courier New', monospace; 
    font-size:14px; 
    line-height:1.6;
}

.char-details h2 {
    color:#7feeff;
    margin-bottom:15px;
    text-shadow: 0 0 10px rgba(0,229,255,0.6);
}

.char-details p {
    margin-bottom: 5px;
}

.char-details b {
    color: #ffb300;
}

/* Atributos en barra */
.attr-bar {
    display: inline-block;
    height: 10px;
    background: #00E5FF;
    margin-left: 10px;
    box-shadow: 0 0 10px #00E5FF;
}

</style>

</head>

<body>

<audio id="bgAudio" src="sonidofondo.mp3" loop></audio>

<div id="scene"></div>

<div class="center">

<img
src="XANA.webp"
class="logo"
id="logo">

</div>

<div id="journalWindow">

<div class="window-header">

<div class="window-title">

<div class="logo-cd"></div>

BASE DE DATOS \ PERSONAJES

</div>

</div>

<div class="window-content">

<div
class="journal-grid"
id="journalGrid">

</div>

</div>

</div>

<div id="characterViewer">

<div class="character-box" id="playerBox">

    <div class="player-header">

        <span id="charTitle" style="font-size: 14px;">
            DATOS DE PERSONAJE
        </span>

        <div class="closePlayer" onclick="closeCharacter()">✕</div>

    </div>

    <div class="char-content">
        <div class="char-image-container">
            <img id="charImage" src="" alt="Personaje">
        </div>
        <div class="char-details">
            <h2 id="charName">NOMBRE</h2>
            <p><b>Versión:</b> <span id="charVersion"></span></p>
            <p><b>Temporada:</b> <span id="charSeasons"></span></p>
            <p><b>Atuendo:</b> <span id="charOutfits"></span></p>
            <p><b>Arma:</b> <span id="charWeapon"></span></p>
            <br>
            <p id="charDesc" style="font-size: 13px; font-style: italic;"></p>
            <br>
            <p><b>Atributos:</b></p>
            <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 10px;">
                <div style="display: flex; align-items: center;">
                    <span style="width: 40px;">SPD:</span> <span id="charSpdBar" class="attr-bar"></span> <span id="charSpd" style="margin-left: 10px;"></span>
                </div>
                <div style="display: flex; align-items: center;">
                    <span style="width: 40px;">AI:</span> <span id="charAiBar" class="attr-bar" style="background:#ffb300; box-shadow: 0 0 10px #ffb300;"></span> <span id="charAi" style="margin-left: 10px;"></span>
                </div>
                <div style="display: flex; align-items: center;">
                    <span style="width: 40px;">RNG:</span> <span id="charRngBar" class="attr-bar" style="background:#ff5e00; box-shadow: 0 0 10px #ff5e00;"></span> <span id="charRng" style="margin-left: 10px;"></span>
                </div>
            </div>
        </div>
    </div>

</div>

</div>

<script>

/* =========================================================
   SÍNTESIS DE SONIDOS VÍA WEB AUDIO API
========================================================= */
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playSynth(type, freq, duration) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
}

function soundXanaChill() {
    playSynth('sine', 350, 1.5);
    setTimeout(() => playSynth('triangle', 550, 2), 200);
}

function soundComputerOpen() {
    playSynth('square', 800, 0.1);
    setTimeout(() => playSynth('sine', 1200, 0.4), 100);
    setTimeout(() => playSynth('sine', 1600, 0.6), 250);
}

/* =========================================================
   TERMINALES
========================================================= */

const TOTAL = 70;

const scene =
document.getElementById("scene");

const terminals = [];

for(let i=0;i<TOTAL;i++){

    const t =
    document.createElement("div");

    t.className =
    "terminal";

    t.innerHTML =
    "1111111111111111111<br>0000000000000000000<br>0011111111111111111";

    const x =
    (Math.random()-0.5)
    *5000;

    const y =
    (Math.random()-0.5)
    *3000;

    const z =
    Math.random()*5000+200;

    terminals.push({
        el:t,x,y,z
    });

    scene.appendChild(t);
}

const cx =
window.innerWidth/2;

const cy =
window.innerHeight/2;

function animate(){

    for(let t of terminals){

        t.z -= 18;

        if(t.z < 150){

            t.z = 5200;

            t.x =
            (Math.random()-0.5)
            *5000;

            t.y =
            (Math.random()-0.5)
            *3000;
        }

        const scale =
        1000 / t.z;

        const sx =
        cx + (t.x*scale);

        const sy =
        cy + (t.y*scale);

        t.el.style.opacity =
        scale*2;

        t.el.style.transform =
        `translate3d(${sx}px,
        ${sy}px,0)
        scale(${scale})`;
    }

    requestAnimationFrame(
    animate);
}

animate();

/* =========================================================
   XANA
========================================================= */

const logo =
document.getElementById("logo");

const journal =
document.getElementById(
"journalWindow");

const bgAudio = document.getElementById("bgAudio");

logo.addEventListener(
"click",()=>{
    
    // Iniciar audios
    if(audioCtx.state === 'suspended') audioCtx.resume();
    soundXanaChill();
    
    bgAudio.volume = 0.5;
    bgAudio.play().catch(e => console.log("Fondo sin cargar aún"));

    logo.classList.add(
    "zoomOut");

    setTimeout(()=>{

        logo.style.display =
        "none";

        journal.style.pointerEvents =
        "auto";

        journal.classList.add(
        "bookOpen");
        
        soundComputerOpen();

        loadCharacters();

    },1200);

});


/* =========================================================
   CARGAR PERSONAJES DESDE JSON
========================================================= */

async function loadCharacters(){
    try {
        const response = await fetch("https://raw.githubusercontent.com/boxplusteam/lyoko.github.io/refs/heads/main/characters.json");
        const characters = await response.json();
        
        const grid = document.getElementById("journalGrid");
        grid.innerHTML = "";

        characters.forEach((char, index)=>{

            const item = document.createElement("div");
            item.className = "journal-item";

            item.innerHTML = `
            <div class="journal-rhombus">
                <div class="cd-center"></div>
            </div>
            <br>
            <div class="journal-label">
                ${char.name}<br>
                <span style="color: #7feeff; font-size: 9px;">${char.version || ''}</span>
            </div>
            `;

            setTimeout(()=>{
                item.classList.add("show");
            },index * 90);

            const rhombus = item.querySelector(".journal-rhombus");

            item.addEventListener("click",()=>{
                document
                .querySelectorAll(".journal-rhombus")
                .forEach(r=>{
                    r.classList.remove("active");
                });

                rhombus.classList.add("active");

                openCharacter(char);
            });

            grid.appendChild(item);
        });

    } catch(error) {
        console.error("Error al cargar los personajes:", error);
    }
}

/* =========================================================
   ABRIR VISUALIZADOR DE PERSONAJE
========================================================= */

const characterViewer = document.getElementById("characterViewer");

function openCharacter(char){
    characterViewer.style.display = "flex";
    
    document.getElementById("charTitle").innerText = "ARCHIVO: " + char.name;
    document.getElementById("charName").innerText = char.name;
    
    // Ruta de la imagen (se asume relativa a la página donde se aloje)
    document.getElementById("charImage").src = char.image || "";
    
    document.getElementById("charVersion").innerText = char.version || "N/A";
    document.getElementById("charSeasons").innerText = char.seasons || "N/A";
    document.getElementById("charOutfits").innerText = char.outfits || "N/A";
    document.getElementById("charWeapon").innerText = char.weapon || "N/A";
    
    document.getElementById("charDesc").innerText = char.description || char.wiki_long || "Sin descripción disponible.";

    // Atributos
    const attrs = char.attributes || { spd: 0, ai: 0, rng: 0 };
    
    document.getElementById("charSpd").innerText = attrs.spd || 0;
    document.getElementById("charSpdBar").style.width = (attrs.spd || 0) + "px";

    document.getElementById("charAi").innerText = attrs.ai || 0;
    document.getElementById("charAiBar").style.width = (attrs.ai || 0) + "px";

    document.getElementById("charRng").innerText = attrs.rng || 0;
    document.getElementById("charRngBar").style.width = (attrs.rng || 0) + "px";
}

/* =========================================================
   CERRAR VISUALIZADOR
========================================================= */

function closeCharacter(){
    characterViewer.style.display = "none";
}

</script>

</body>
</html>
